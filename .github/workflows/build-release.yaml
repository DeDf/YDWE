name: Build and Release YDWE (Default Toolset)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # 尝试通过环境变量让 MSBuild 使用默认工具集 v143
      # 如果 YDWE 项目文件里硬编码了 v141，这一步可能无效，需要进仓库搜索替换
      - name: Run Build Script
        shell: cmd
        run: |
          set PlatformToolset=v143
          cd Build
          call Build_Release.bat

      - name: Verify Build Output
        shell: cmd
        run: |
          if not exist "Build\publish\Release\" (
            echo "编译失败：未找到输出目录"
            exit 1
          )
          dir "Build\publish\Release\"

      - name: Package Release
        shell: pwsh
        run: |
          Compress-Archive -Path "Build\publish\Release\*" -DestinationPath "YDWE-Release.zip" -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YDWE-Release-Build
          path: YDWE-Release.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: YDWE-Release.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}